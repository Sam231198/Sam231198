name: Update GitHub Metrics SVG

on:
  schedule:
    - cron: "0 3 * * *"   # Todo dia às 03:00 UTC (00:00 BRT)
  workflow_dispatch:       # Permite rodar manualmente

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar SVG de métricas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: python app/generate_metrics.py

      - name: Commit e push do SVG atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my_custom_metric.svg
          git diff --staged --quiet || git commit -m "chore: atualiza métricas [skip ci]"
          git push
